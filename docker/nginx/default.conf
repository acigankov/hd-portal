server {
    listen 80;
    server_name localhost;

    root /var/www/html/web;
    index index.php;

    client_max_body_size 128M;

    # Скрываем версию nginx
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Тестовая точка входа не должна быть доступна снаружи
    location = /index-test.php {
        deny all;
    }

    location ~ \.php$ {
        # try_files обязателен: без него запрос вида /uploads/file.png/x.php
        # уходит в php-fpm и приводит к исполнению произвольного файла
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Служебные и скрытые файлы
    location ~ /\.(ht|git|env) {
        deny all;
    }
}
